<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>前台登记（预约转就诊）</title>
    <style>
        .step { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
        input, select { margin: 5px 0; }
        #apptInfo { margin: 10px 0; padding: 10px; background: #f5f5f5; display: none; }
    </style>
</head>
<body>
    <h1>前台登记（预约转就诊）</h1>
    
    <!-- 步骤1：核验预约 -->
    <div class="step">
        <h3>步骤1：核验预约记录</h3>
        <div>
            <label>预约ID：</label>
            <input type="number" id="apptId" placeholder="可选，优先核验">
        </div>
        <div>
            <label>患者手机号：</label>
            <input type="tel" id="phone" placeholder="必填，核验预约">
        </div>
        <button onclick="checkAppointment()">核验预约（执行SELECT SQL）</button>
        <!-- 显示核验结果 -->
        <div id="apptInfo"></div>
    </div>

    <!-- 步骤2：填写患者&就诊信息（核验成功后显示） -->
    <div class="step" id="registerForm" style="display: none;">
        <h3>步骤2：患者登记 & 就诊分配</h3>
        <form id="registerFormContent" action="/reception/submit_register" method="post">
            <!-- 隐藏字段：预约ID（从核验结果获取） -->
            <input type="hidden" name="appt_id" id="hiddenApptId">
            
            <!-- 患者信息 -->
            <h4>患者信息（新患者必填，老患者自动填充）</h4>
            <div>
                <label>身份证号：</label>
                <input type="text" name="id_card" required placeholder="18位身份证号">
            </div>
            <div>
                <label>姓名：</label>
                <input type="text" name="patient_name" id="patientName" required>
            </div>
            <div>
                <label>性别：</label>
                <select name="gender" required>
                    <option value="男">男</option>
                    <option value="女">女</option>
                    <option value="其他">其他</option>
                </select>
            </div>
            <div>
                <label>手机号：</label>
                <input type="tel" name="phone" id="patientPhone" required>
            </div>

            <!-- 就诊信息 -->
            <h4>就诊分配</h4>
            <div>
                <label>诊室：</label>
                <select name="room_id" required>
                    {% for room in rooms %}
                    <option value="{{ room.room_id }}">{{ room.room_num }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label>接诊医生：</label>
                <select name="doctor_id" required>
                    {% for doc in doctors %}
                    <option value="{{ doc.emp_id }}">{{ doc.emp_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit">提交登记（执行INSERT+UPDATE SQL）</button>
        </form>
    </div>

    <!-- 步骤3：就诊确认（可选） -->
    <div class="step">
        <h3>步骤3：就诊状态确认</h3>
        <div>
            <label>就诊记录ID：</label>
            <input type="number" id="recordId" placeholder="登记成功后生成的就诊ID">
        </div>
        <div>
            <label>更新状态：</label>
            <select id="visitStatus">
                <option value="就诊中">就诊中</option>
                <option value="已接诊">已接诊</option>
                <option value="未缴费">未缴费</option>
            </select>
        </div>
        <button onclick="confirmVisit()">确认就诊状态（执行UPDATE SQL）</button>
        <div id="confirmResult"></div>
    </div>

    <script>
        // 步骤1：核验预约
        function checkAppointment() {
            const apptId = document.getElementById('apptId').value;
            const phone = document.getElementById('phone').value;
            
            fetch('/reception/check_appointment', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `appt_id=${apptId}&phone=${phone}`
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success' && data.data.length > 0) {
                    // 显示预约信息
                    const appt = data.data[0];
                    document.getElementById('apptInfo').style.display = 'block';
                    document.getElementById('apptInfo').innerHTML = `
                        <p>预约信息核验成功！</p>
                        <p>预约ID：${appt.appt_id}</p>
                        <p>姓名：${appt.patient_name}</p>
                        <p>预约科室：${appt.dept_id}</p>
                        <p>预计就诊时间：${appt.expected_arrive}</p>
                    `;
                    // 填充隐藏字段和表单默认值
                    document.getElementById('hiddenApptId').value = appt.appt_id;
                    document.getElementById('patientName').value = appt.patient_name;
                    document.getElementById('patientPhone').value = appt.phone;
                    // 显示登记表单
                    document.getElementById('registerForm').style.display = 'block';
                } else {
                    document.getElementById('apptInfo').style.display = 'block';
                    document.getElementById('apptInfo').innerHTML = '预约核验失败：' + (data.msg || '无未就诊的预约记录');
                }
            });
        }

        // 步骤3：确认就诊状态
        function confirmVisit() {
            const recordId = document.getElementById('recordId').value;
            const status = document.getElementById('visitStatus').value;
            
            fetch('/reception/confirm_visit', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `record_id=${recordId}&status=${status}`
            })
            .then(res => res.text())
            .then(data => {
                document.getElementById('confirmResult').innerHTML = data;
            });
        }
    </script>
</body>
</html>
